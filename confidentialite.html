<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confidentialité — Iboukoun Cosmetics</title><meta name="description" content="Utilisation et protection des données transmises à Iboukoun Cosmetics."><link rel="stylesheet" href="/assets/admin.css"></head><body><!-- <main><a href="/">Accueil</a><h1>Confidentialité</h1><p>Les informations transmises dans les formulaires servent à répondre aux messages, traiter les demandes de commande et recontacter les candidats revendeurs. Les demandes de commande sont confirmées avec vous avant livraison.</p><p>Les formulaires de commande recueillent votre nom, votre numéro WhatsApp, votre numéro d’appel, votre ville, votre quartier et les produits demandés. Le formulaire de contact recueille les coordonnées que vous renseignez et votre message. La candidature revendeur recueille votre nom, votre ville et votre numéro de téléphone.</p><p>Ces informations sont hébergées dans le projet Supabase de la marque et accessibles aux administrateurs autorisés. Les formulaires utilisent Cloudflare Turnstile pour limiter les envois automatisés. WhatsApp et YouTube, si vous utilisez leurs liens ou lecteurs, appliquent leurs propres politiques.</p><p>Un identifiant calculé à partir de l’adresse réseau et d’un secret serveur est conservé temporairement pour limiter les abus. L’administration utilise un stockage de session dans l’onglet du navigateur pour maintenir la connexion. Le site peut compter les consultations de pages et les clics WhatsApp, sans stocker l’adresse IP brute dans les tables de visites.</p><p>Pour demander l’accès, la rectification ou la suppression de vos informations, contactez la marque via <a href="/contact.html">la page de contact</a>.</p><p>Avant la mise en ligne, le responsable du site doit préciser l’identité du responsable de traitement, les durées de conservation, la région d’hébergement et les modalités applicables aux droits et aux transferts de données.</p></main> --></body></html>
